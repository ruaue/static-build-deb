name: Build and Release shoes deb package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TZ: Asia/Shanghai

jobs:
  build-deb:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Use commit SHA for non-tag builds
            VERSION="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ruby \
            ruby-dev \
            binutils
          
          # Install FPM for creating deb packages
          sudo gem install --no-document fpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build shoes binary (release mode)
        run: |
          cargo build --release --bin shoes
          
          # Verify binary was created
          if [ ! -f target/release/shoes ]; then
            echo "Error: Binary not found"
            exit 1
          fi
          
          echo "Binary info:"
          file target/release/shoes
          ls -lh target/release/shoes

      - name: Prepare package directory structure
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGING_DIR="shoes-package"
          
          # Create standard Debian package directory structure
          mkdir -p "${STAGING_DIR}/usr/bin"
          mkdir -p "${STAGING_DIR}/etc/shoes"
          mkdir -p "${STAGING_DIR}/usr/lib/systemd/system"
          mkdir -p "${STAGING_DIR}/usr/share/doc/shoes"
          mkdir -p "${STAGING_DIR}/usr/share/man/man1"
          
          # Copy binary
          cp target/release/shoes "${STAGING_DIR}/usr/bin/"
          
          # Strip binary to reduce size
          strip "${STAGING_DIR}/usr/bin/shoes"
          
          # Make executable
          chmod +x "${STAGING_DIR}/usr/bin/shoes"
          
          echo "Binary prepared:"
          ls -lh "${STAGING_DIR}/usr/bin/shoes"

      - name: Copy example configurations
        run: |
          STAGING_DIR="shoes-package"
          
          # Copy example configs if they exist
          if [ -d "examples" ]; then
            cp -r examples/* "${STAGING_DIR}/etc/shoes/" || true
            
            # Rename to .example suffix
            find "${STAGING_DIR}/etc/shoes" -type f -name "*.yaml" -exec mv {} {}.example \; || true
          fi
          
          # Create a basic default config template if examples don't exist
          if [ ! -f "${STAGING_DIR}/etc/shoes/config.yaml.example" ]; then
            cat > "${STAGING_DIR}/etc/shoes/config.yaml.example" <<'EOF'
               # Shoes proxy server configuration example
               # See: https://github.com/cfal/shoes for full documentation

               # Example SOCKS5 server
               - address: 127.0.0.1:1080
                 protocol:
                 type: socks
                 rules:
              - masks: "0.0.0.0/0"
                action: allow
                client_proxy: direct

              # Example VMess server (TLS)
              # - address: 0.0.0.0:443
              #   protocol:
              #     type: vmess
              #     cipher: chacha20-poly1305
              #     user_id: YOUR-UUID-HERE
              #     udp_enabled: true
              EOF
             fi

      - name: Create systemd service file
        run: |
          STAGING_DIR="shoes-package"
          
          cat > "${STAGING_DIR}/usr/lib/systemd/system/shoes.service" <<'EOF'
             [Unit]
              Description=Shoes Multi-Protocol Proxy Server
              Documentation=https://github.com/cfal/shoes
              After=network-online.target
              Wants=network-online.target

             [Service]
              Type=simple
              ExecStart=/usr/bin/shoes /etc/shoes/config.yaml
              Restart=on-failure
              RestartSec=5s
              User=shoes
              Group=shoes
              CapabilityBoundingSet=CAP_NET_BIND_SERVICE
              AmbientCapabilities=CAP_NET_BIND_SERVICE
              NoNewPrivileges=true
              ProtectSystem=strict
              ProtectHome=true
              ReadWritePaths=/var/log/shoes
              PrivateTmp=true
              LimitNOFILE=65536

             [Install]
              WantedBy=multi-user.target
              EOF

      - name: Create documentation files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGING_DIR="shoes-package"
          
          # Create README
          cat > "${STAGING_DIR}/usr/share/doc/shoes/README" <<EOF
             Shoes - Multi-Protocol Proxy Server
             ====================================

             Version: ${VERSION}

             Shoes is a high-performance multi-protocol proxy server written in Rust.

             Supported Protocols:
             - HTTP/HTTPS
             - SOCKS5
             - VMess AEAD
             - VLESS
             - Shadowsocks
             - Trojan
             - Snell v3
             - Hysteria2
             - TUIC v5

           Configuration:
             - Main config: /etc/shoes/config.yaml
             - Examples: /etc/shoes/*.example

           Systemd Service:
            - Enable: sudo systemctl enable shoes
            - Start: sudo systemctl start shoes
            - Status: sudo systemctl status shoes
            - Logs: sudo journalctl -u shoes -f

           Documentation:
            https://github.com/cfal/shoes
            https://github.com/cfal/shoes/blob/master/CONFIG.md

           EOF
          
          # Create copyright file
          cat > "${STAGING_DIR}/usr/share/doc/shoes/copyright" <<'EOF'
              Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
              Upstream-Name: shoes
              Source: https://github.com/cfal/shoes

             Files: *
             Copyright: 2024 cfal and contributors
             License: MIT

             License: MIT
             Permission is hereby granted, free of charge, to any person obtaining a copy
             of this software and associated documentation files (the "Software"), to deal
             in the Software without restriction, including without limitation the rights
             to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
             copies of the Software, and to permit persons to whom the Software is
             furnished to do so, subject to the following conditions:
             .
             The above copyright notice and this permission notice shall be included in all
             copies or substantial portions of the Software.
              .
             THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
             IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
             FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
             AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
             LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
             OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
             SOFTWARE.
            EOF

          # Copy CHANGELOG if exists
          if [ -f "CHANGELOG.md" ]; then
            cp CHANGELOG.md "${STAGING_DIR}/usr/share/doc/shoes/"
          fi

      - name: Create post-install and pre-remove scripts
        run: |
          # Post-install script
          cat > postinst.sh <<'EOF'
           #!/bin/bash
           set -e

          # Create shoes user and group if they don't exist
            if ! getent group shoes > /dev/null; then
            groupadd --system shoes
            fi

            if ! getent passwd shoes > /dev/null; then
             useradd --system --gid shoes --shell /usr/sbin/nologin \
            --home-dir /var/lib/shoes --no-create-home \
            --comment "Shoes proxy server" shoes
            fi

           # Create log directory
            mkdir -p /var/log/shoes
            chown shoes:shoes /var/log/shoes

           # Set proper permissions on config directory
           chown -R root:shoes /etc/shoes
           chmod 750 /etc/shoes
           chmod 640 /etc/shoes/*.example 2>/dev/null || true

           # Reload systemd
           if [ -d /run/systemd/system ]; then
            systemctl daemon-reload || true
           fi

           echo ""
           echo "Shoes proxy server installed successfully!"
           echo ""
           echo "Next steps:"
           echo "  1. Create config: sudo cp /etc/shoes/config.yaml.example /etc/shoes/config.yaml"
           echo "  2. Edit config: sudo nano /etc/shoes/config.yaml"
           echo "  3. Enable service: sudo systemctl enable shoes"
           echo "  4. Start service: sudo systemctl start shoes"
           echo "  5. Check status: sudo systemctl status shoes"
           echo ""
           EOF

          # Pre-remove script
          cat > prerm.sh <<'EOF'
             #!/bin/bash
             set -e

            # Stop and disable service before removal
              if [ -d /run/systemd/system ]; then
              systemctl stop shoes 2>/dev/null || true
              systemctl disable shoes 2>/dev/null || true
              fi
              EOF

          chmod +x postinst.sh prerm.sh

      - name: Debug staging directory
        run: |
          echo "=== Package contents preview ==="
          find shoes-package -type f | sort

      - name: Build deb package with FPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGING_DIR="shoes-package"
          
          fpm -s dir \
            -t deb \
            -n "shoes" \
            -v "${VERSION}" \
            -a "amd64" \
            --license "MIT" \
            --vendor "cfal and contributors" \
            --maintainer "GitHub Actions <noreply@github.com>" \
            --description "A high-performance multi-protocol proxy server written in Rust
               Supports HTTP, SOCKS5, VMess, VLESS, Shadowsocks, Trojan, Snell,
               Hysteria2, and TUIC v5 protocols." \
            --url "https://github.com/cfal/shoes" \
            --category "net" \
            --provides "proxy-server" \
            --deb-priority "optional" \
            --deb-compression "xz" \
            --depends "libc6 (>= 2.31)" \
            --depends "libssl3 | libssl1.1" \
            --config-files "/etc/shoes/config.yaml.example" \
            --deb-systemd "${STAGING_DIR}/usr/lib/systemd/system/shoes.service" \
            --after-install postinst.sh \
            --before-remove prerm.sh \
            -C "${STAGING_DIR}" \
            -f

      - name: Verify package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_NAME="shoes_${VERSION}_amd64.deb"
          
          echo "=== Package info ==="
          ls -lh "${PKG_NAME}"
          
          echo ""
          echo "=== Package metadata ==="
          dpkg-deb --info "${PKG_NAME}"
          
          echo ""
          echo "=== Package contents ==="
          dpkg-deb --contents "${PKG_NAME}"

      - name: Calculate checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_NAME="shoes_${VERSION}_amd64.deb"
          
          sha256sum "${PKG_NAME}" > "${PKG_NAME}.sha256"
          md5sum "${PKG_NAME}" > "${PKG_NAME}.md5"
          
          echo "=== Checksums ==="
          cat "${PKG_NAME}.sha256"
          cat "${PKG_NAME}.md5"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shoes-deb-package
          path: |
            *.deb
            *.sha256
            *.md5
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            *.deb
            *.sha256
            *.md5
          body: |
            ## Shoes ${{ steps.version.outputs.version }}
            
            Debian package for the Shoes multi-protocol proxy server.
            
            ### Supported Protocols
            - HTTP/HTTPS, SOCKS5
            - VMess AEAD, VLESS
            - Shadowsocks (including 2022 edition)
            - Trojan, Snell v3
            - Hysteria2, TUIC v5
            
            ### Installation
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shoes_${{ steps.version.outputs.version }}_amd64.deb
            sudo dpkg -i shoes_${{ steps.version.outputs.version }}_amd64.deb
            sudo apt-get install -f  # Install dependencies if needed
            ```
            
            ### Quick Start
            ```bash
            # Create configuration
            sudo cp /etc/shoes/config.yaml.example /etc/shoes/config.yaml
            sudo nano /etc/shoes/config.yaml
            
            # Enable and start service
            sudo systemctl enable --now shoes
            sudo systemctl status shoes
            ```
            
            ### Documentation
            - [Configuration Guide](https://github.com/cfal/shoes/blob/master/CONFIG.md)
            - [Examples](https://github.com/cfal/shoes/tree/master/examples)
            
            ### Checksums
            See attached `.sha256` and `.md5` files for verification.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Test installation in clean environment
  test-installation:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: shoes-deb-package

      - name: Test installation
        run: |
          sudo dpkg -i *.deb || sudo apt-get install -f -y
          
          echo "=== Verify binary ==="
          which shoes
          shoes --help || true
          
          echo ""
          echo "=== Check service file ==="
          systemctl cat shoes || true
          
          echo ""
          echo "=== Verify config directory ==="
          ls -la /etc/shoes/
          
          echo ""
          echo "=== Check user and group ==="
          getent passwd shoes
          getent group shoes
          
          echo ""
          echo "=== Verify permissions ==="
          ls -ld /etc/shoes
          ls -l /etc/shoes/

      - name: Test dry-run
        run: |
          # Try to parse example config (dry-run)
          sudo shoes --dry-run /etc/shoes/config.yaml.example || echo "Dry-run test completed (errors expected if config needs customization)"
